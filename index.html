<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Design 3D-printable slump and drape molds shaped like Michigan's Lower or Upper Peninsula for a ceramic spoon rest.">
<title>Michigan Mold Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen tool — controls rail on the left, 3D workbench on the right; stacks on phones. */
:root {
  --bg: #eef1f3;          /* cool studio grey */
  --panel: #fbfcfc;
  --ink: #1b2730;
  --muted: #5b6b77;
  --line: #d6dde2;
  --lake: #1d5d8c;        /* Great Lakes blue accent */
  --clay: #c9895a;        /* the mold's material colour in the viewer */
  --good: #2f7d4f;
  --warn: #b5541c;
  --viewer: #e3e8ec;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181d; --panel: #182128; --ink: #e5ecf0; --muted: #94a5b1; --line: #2a3640;
    --lake: #6cb4e6; --clay: #d79b6c; --good: #5cc488; --warn: #f0925a; --viewer: #1c262e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181d; --panel: #182128; --ink: #e5ecf0; --muted: #94a5b1; --line: #2a3640;
  --lake: #6cb4e6; --clay: #d79b6c; --good: #5cc488; --warn: #f0925a; --viewer: #1c262e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); }
.app { height: 100%; display: grid; grid-template-columns: 340px 1fr; grid-template-rows: auto 1fr; }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding: 14px 20px 10px; border-bottom: 1px solid var(--line); }
header h1 { font: 700 22px/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
.rail { overflow-y: auto; padding: 14px 18px 24px; border-right: 1px solid var(--line); background: var(--panel); }
.group { display: grid; gap: 10px; padding: 12px 0 14px; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; }
.group[hidden] { display: none; }
.group h2 { font: 600 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 8px 10px; cursor: pointer; text-align: center; font-weight: 500; }
.seg label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.seg input:checked + label { background: var(--lake); color: #fff; }
.seg input:checked + label small { color: rgba(255,255,255,.85); }
.seg input:focus-visible + label { outline: 2px solid var(--lake); outline-offset: -4px; }
.ctl { display: grid; gap: 2px; }
.ctl .row { display: flex; justify-content: space-between; gap: 8px; }
.ctl output { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.ctl output b { color: var(--ink); font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--lake); margin: 2px 0; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { accent-color: var(--lake); width: 16px; height: 16px; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.field input, .field select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; }
.field input[type=number] { width: 64px; font-variant-numeric: tabular-nums; }
.field .pair { display: flex; align-items: center; gap: 4px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
button.link { background: none; border: 0; color: var(--lake); font: inherit; padding: 0; cursor: pointer; text-align: left; }
button.link:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--lake); outline-offset: 2px; }

.bench { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 8px; }
.chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 10px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.chip.good { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.chip.good .v::before { content: "✓ "; color: var(--good); }
.chip.warn { border-color: var(--warn); }
.chip.warn .v { color: var(--warn); }
.chip.warn .v::before { content: "⚠ "; }
.viewer { position: relative; margin: 0 16px; border-radius: 12px; background: var(--viewer); overflow: hidden; min-height: 280px; }
.viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; justify-content: space-between;
  gap: 8px; flex-wrap: wrap; pointer-events: none; color: var(--muted); font-size: 12.5px; }
.overlay .legend { display: flex; gap: 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.busy { position: absolute; top: 10px; right: 12px; padding: 4px 10px; border-radius: 999px; background: var(--panel);
  border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.busy[hidden] { display: none; }
.actions { display: flex; align-items: center; gap: 14px; padding: 12px 16px 16px; flex-wrap: wrap; }
.primary { font: 600 15px/1 var(--font-body); color: #fff; background: var(--lake); border: 0; border-radius: 10px;
  padding: 13px 18px; cursor: pointer; }
.primary:hover { filter: brightness(1.08); }
.primary:disabled { opacity: .55; cursor: default; filter: none; }
#status { color: var(--muted); }
#status.err { color: var(--warn); }
.howto { color: var(--muted); font-size: 12.5px; margin-left: auto; max-width: 52ch; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
  html, body { height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .viewer { height: 60vw; min-height: 300px; }
  .howto { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div class="app">
  <header>
    <h1>Michigan Mold Maker</h1>
    <p>Lower or Upper Peninsula slump and drape molds for a ceramic spoon rest, ready to 3D print.</p>
  </header>

  <aside class="rail" id="rail">
    <div class="group">
      <h2>Peninsula</h2>
      <div class="seg" role="radiogroup" aria-label="Peninsula">
        <input type="radio" name="peninsula" id="pen-lower" value="lower" checked>
        <label for="pen-lower">Lower<small>the mitten</small></label>
        <input type="radio" name="peninsula" id="pen-upper" value="upper">
        <label for="pen-upper">Upper<small>the U.P.</small></label>
      </div>
      <p class="hint" id="pen-note" hidden></p>
    </div>
    <div class="group">
      <h2>Mold type</h2>
      <div class="seg" role="radiogroup" aria-label="Mold type">
        <input type="radio" name="style" id="style-drape" value="drape" checked>
        <label for="style-drape">Drape<small>slab goes over</small></label>
        <input type="radio" name="style" id="style-slump" value="slump">
        <label for="style-slump">Slump<small>slab goes in</small></label>
      </div>
    </div>
    <div class="group" data-group="Size"><h2>Size</h2></div>
    <div class="group" data-group="Shape"><h2>Shape</h2></div>
    <div class="group" data-group="Drape"><h2>Drape options</h2></div>
    <div class="group" data-group="Slump"><h2>Slump options</h2></div>
    <div class="group" data-group="Stand">
      <h2>Threaded stand</h2>
      <label class="check"><input type="checkbox" id="socket" checked> Threaded socket in the mold</label>
      <label class="check"><input type="checkbox" id="stand" checked> Also make the screw-in stand</label>
    </div>
    <div class="group">
      <h2>Output</h2>
      <div class="field"><label for="quality">Surface quality</label>
        <select id="quality">
          <option value="0.6">Draft (fast)</option>
          <option value="0.3" selected>Standard</option>
          <option value="0.2">Fine (big file)</option>
        </select></div>
      <div class="field"><label for="bed_x">Printer bed (mm)</label>
        <span class="pair"><input type="number" id="bed_x" value="256" min="50" max="1000"> ×
        <input type="number" id="bed_y" value="256" min="50" max="1000"></span></div>
      <div class="field"><label for="fname">File name</label>
        <input type="text" id="fname" value="lp_spoon_rest" style="width: 150px"></div>
      <button class="link" id="reset" type="button">Reset to defaults</button>
    </div>
  </aside>

  <main class="bench">
    <div class="chips" id="chips"></div>
    <div class="viewer" id="viewer">
      <div class="busy" id="busy" hidden>Updating preview…</div>
      <div class="overlay">
        <span class="legend" id="legend"></span>
        <span>Drag to rotate · scroll or pinch to zoom</span>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="go" type="button">Download STL files (.zip)</button>
      <span id="status" role="status">Loading the geometry engine…</span>
      <p class="howto" id="howto"></p>
    </div>
  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
